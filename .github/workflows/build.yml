name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev libpng-dev
      # the clients need the proprietary Leap Motion SDK, so they are only compile-checked
      - run: make
