name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev libpng-dev xvfb
      # server, lighting demos, compile-check of the clients (linking them needs the proprietary Leap SDK)
      - run: make
      # unit tests, server protocol over TCP, demos under xvfb
      - run: make test
